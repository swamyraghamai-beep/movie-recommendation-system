<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - MovieHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="login-box">
        <h2>🎬 Movie Hub</h2>
        <h1>🔐 Login</h1>

        {% include "_flash_messages.html" %}

        <form action="{{ url_for('login') }}" method="post">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" maxlength="50" autocomplete="username" required>
            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" data-password-target="password" aria-label="Show password" aria-pressed="false">👁</button>
            </div>
            <button type="submit">🎬 Log in</button>
        </form>

        <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
